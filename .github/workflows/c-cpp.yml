name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  text-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check comments and invisible characters
      run: python3 tools/check_text.py
    - name: Check commit messages
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 tools/check_commits.py "$BASE..$HEAD"

  build:
    permissions:
      checks: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: apt-get update
      run: sudo apt-get update
    - name: Install packages
      run: sudo apt-get install ccache libcmocka-dev liburing-dev cmake ninja-build llvm-20-dev libgtest-dev libreadline-dev lld nodejs g++-14
    - name: Set up ccache
      uses: Chocobo1/setup-ccache-action@a4d08616f5b614053bce228ddf881592f69d61d4 # v1.5.9
      with:
        install_ccache: false
        update_packager_index: false
        prepend_symlinks_to_path: false
        # Only pushes to master save the cache; pull requests restore it.
        store_cache: ${{ github.event_name == 'push' }}
        remove_stale_cache: false
        ccache_options: |
          max_size=2G
    - name: configure
      run: |
        mkdir build
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
          -DLLVM_DIR="$(llvm-config-20 --cmakedir)" \
          -DCMAKE_PREFIX_PATH="$(llvm-config-20 --prefix)" \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DQUMIR_BUILD_TESTS=ON
    - name: make
      run: cmake --build build
    - name: test
      run: cmake --build build --target test
    - name: test-log
      if: failure()
      run: cat build/Testing/Temporary/LastTest.log
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
         files: build/test/*.xml
         check_name: Unit Test Results (Linux)
